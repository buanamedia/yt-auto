<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Registrasi - YT Auto Auto Scheduler</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Rigusapps/yt-auto/refs/heads/main/logo%20yt%20auto.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between items-center p-4">

  <!-- SPACER ATAS AGAR CARD TEPAT DI TENGAH -->
  <div></div>

  <!-- CARD UTAMA -->
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden my-auto">
    
    <!-- LOGO APLIKASI DENGAN GAMBAR RAW GITHUB -->
    <div class="pt-8 pb-4 text-center border-b border-gray-100">
      <div class="inline-flex items-center justify-center gap-3">
        <img src="https://raw.githubusercontent.com/Rigusapps/yt-auto/refs/heads/main/logo%20yt%20auto.png" alt="YT Auto Logo" class="h-10 w-auto object-contain">
        <div class="text-left">
          <h1 class="text-xl font-extrabold text-gray-900 tracking-tight leading-none">YT Auto Scheduler</h1>
          <span class="text-[10px] font-semibold text-gray-400 uppercase tracking-widest block mt-0.5">Auto Upload & Manage</span>
        </div>
      </div>
    </div>

    <!-- TAB SWITCHER -->
    <div class="flex border-b">
      <button id="tabLoginBtn" onclick="switchTab('login')" class="w-1/2 py-3.5 text-center font-bold text-blue-600 border-b-2 border-blue-600 transition text-sm">
        <i class="fa-solid fa-right-to-bracket mr-1"></i> Masuk
      </button>
      <button id="tabRegisterBtn" onclick="switchTab('register')" class="w-1/2 py-3.5 text-center font-bold text-gray-500 hover:text-gray-700 transition text-sm">
        <i class="fa-solid fa-user-plus mr-1"></i> Daftar
      </button>
    </div>

    <div class="p-6">
      <!-- FORM LOGIN -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Username</label>
          <input type="text" id="loginUsername" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Masukkan username">
        </div>
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-semibold text-gray-700">Password</label>
            <button type="button" onclick="openResetModal()" class="text-xs text-blue-600 hover:underline font-semibold">Lupa Password?</button>
          </div>
          <input type="password" id="loginPassword" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Masukkan password">
        </div>
        <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition text-sm shadow-md shadow-blue-500/20">
          Masuk Sekarang
        </button>
      </form>

      <!-- FORM REGISTRASI -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Username</label>
          <input type="text" id="regUsername" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Username baru">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Email</label>
          <input type="email" id="regEmail" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="nama@email.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Nomor WhatsApp</label>
          <input type="text" id="regWhatsapp" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="081234567890">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
          <input type="password" id="regPassword" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Kata sandi">
        </div>
        <button type="submit" class="w-full py-2.5 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg transition text-sm shadow-md shadow-green-500/20">
          Daftar Akun
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL PENGAJUAN RESET PASSWORD USER -->
  <div id="resetModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex justify-center items-center p-4 z-50">
    <div class="bg-white rounded-xl p-6 max-w-sm w-full shadow-xl relative">
      <h3 class="text-lg font-bold text-gray-800 mb-1">Pengajuan Reset Password</h3>
      <p class="text-xs text-gray-500 mb-4">Masukkan username dan password baru yang Anda inginkan. Pengajuan ini memerlukan persetujuan Admin.</p>

      <form id="resetForm" onsubmit="handleRequestReset(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Username Anda</label>
          <input type="text" id="resetUsername" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Username terdaftar">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Password Baru</label>
          <input type="password" id="resetNewPassword" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Password baru">
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeResetModal()" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold rounded-lg transition">
            Batal
          </button>
          <button type="submit" class="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg transition">
            Kirim Pengajuan
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="w-full text-center py-4 text-xs text-gray-500 mt-6">
    <p>&copy; <script>document.write(new Date().getFullYear())</script> <span class="font-bold text-gray-700">YT Auto Scheduler</span>. All rights reserved.</p>
    <p class="text-[11px] text-gray-400 mt-0.5">Automated YouTube Video Scheduling System</p>
  </footer>

  <script>
    const ADMIN_WA_NUMBER = "6281234567890";

    function switchTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const tabLoginBtn = document.getElementById('tabLoginBtn');
      const tabRegisterBtn = document.getElementById('tabRegisterBtn');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        tabLoginBtn.className = "w-1/2 py-3.5 text-center font-bold text-blue-600 border-b-2 border-blue-600 transition text-sm";
        tabRegisterBtn.className = "w-1/2 py-3.5 text-center font-bold text-gray-500 hover:text-gray-700 transition text-sm";
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        tabRegisterBtn.className = "w-1/2 py-3.5 text-center font-bold text-green-600 border-b-2 border-green-600 transition text-sm";
        tabLoginBtn.className = "w-1/2 py-3.5 text-center font-bold text-gray-500 hover:text-gray-700 transition text-sm";
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login gagal');

        window.location.href = data.user.role === 'admin' ? '/admin.html' : '/';
      } catch (err) {
        alert(err.message);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const whatsapp = document.getElementById('regWhatsapp').value.trim();
      const password = document.getElementById('regPassword').value;

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, whatsapp, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Gagal mendaftar');

        const textMessage = encodeURIComponent(
          `Halo Admin, saya telah mendaftar akun baru di YT Auto Scheduler.\n\n` +
          `*Detail Akun:*\n` +
          `- Username: ${username}\n` +
          `- Email: ${email}\n` +
          `- WhatsApp: ${whatsapp}\n\n` +
          `Mohon persetujuan/aktivasi akun saya. Terima kasih!`
        );

        const waUrl = `https://wa.me/${ADMIN_WA_NUMBER}?text=${textMessage}`;
        showWaConfirmationModal(data.message, waUrl);

      } catch (err) {
        alert(err.message);
      }
    }

    function openResetModal() {
      document.getElementById('resetModal').classList.remove('hidden');
    }

    function closeResetModal() {
      document.getElementById('resetModal').classList.add('hidden');
    }

    async function handleRequestReset(e) {
      e.preventDefault();
      const username = document.getElementById('resetUsername').value.trim();
      const newPassword = document.getElementById('resetNewPassword').value;

      try {
        const res = await fetch('/api/request-reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, newPassword })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Gagal mengajukan reset password');

        const textMessage = encodeURIComponent(
          `Halo Admin, saya mengajukan reset password untuk akun YT Auto Scheduler.\n\n` +
          `*Username:* ${username}\n\n` +
          `Mohon acc/approve persetujuan reset password saya di dashboard admin. Terima kasih!`
        );

        const waUrl = `https://wa.me/${ADMIN_WA_NUMBER}?text=${textMessage}`;
        
        closeResetModal();
        showWaConfirmationModal("Pengajuan reset password berhasil dikirim! Silakan konfirmasi ke Admin untuk persetujuan.", waUrl);

      } catch (err) {
        alert(err.message);
      }
    }

    function showWaConfirmationModal(serverMsg, waUrl) {
      const container = document.createElement('div');
      container.className = 'fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center p-4 z-50';
      container.innerHTML = `
        <div class="bg-white rounded-xl p-6 max-w-sm w-full text-center shadow-xl">
          <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
            <i class="fa-brands fa-whatsapp"></i>
          </div>
          <h3 class="text-lg font-bold text-gray-800 mb-2">Instruksi Lanjutan</h3>
          <p class="text-xs text-gray-600 mb-6">${serverMsg}</p>
          
          <div class="space-y-2">
            <a href="${waUrl}" target="_blank" class="w-full block py-2.5 px-4 bg-green-600 hover:bg-green-700 text-white font-semibold text-xs rounded-lg transition">
              <i class="fa-brands fa-whatsapp mr-1"></i> Hubungi WA Admin
            </a>
            <button onclick="this.closest('.fixed').remove(); switchTab('login');" class="w-full py-2 px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold text-xs rounded-lg transition">
              Tutup & Kembali
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(container);
    }
  </script>
</body>
</html>
